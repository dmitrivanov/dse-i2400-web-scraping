<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MY_CUSTOM_BOT</title><link rel="stylesheet" href="/static/styles.css"><script src="/static/app.js" defer></script><script src="/static/ai.js" defer></script></head>
<body>
<button id="sidebar-backdrop" aria-label="Close history" hidden></button>
<aside id="sidebar" class="history" aria-label="Search history" hidden>
<div class="section-heading"><h2>History</h2><button id="close-history" type="button" aria-label="Close history">×</button></div>
<nav class="sidebar-nav" aria-label="Workspace"><button id="new-search" type="button" aria-current="page"><span aria-hidden="true">✎</span>New search</button><button id="sidebar-library" type="button"><span aria-hidden="true">▤</span>Library</button><button id="history-nav" type="button"><span aria-hidden="true">◷</span>History</button></nav>
<p id="history-status" role="status"></p><div id="history-list"></div></aside>
<header><button id="toggle-history" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open search history">☰</button><a class="brand" href="/search">MY_CUSTOM_BOT</a><button id="open-library" class="text-button" type="button">Library</button></header>
<main id="main">
<section class="search-panel" aria-label="Search composer">
<form id="search-form">
<div class="mode-tabs" role="group" aria-label="Search type"><button id="internet-mode" type="button" aria-pressed="true">Web</button><button id="ai-mode" type="button" aria-pressed="false">AI</button></div>
<label for="query" class="sr-only">Research query</label><textarea id="query" name="query" rows="2" maxlength="1000" required placeholder="What would you like to search?">childhood cancer early diagnosis methods</textarea>
<div class="controls" id="internet-controls"><label class="sr-only" for="engine">Web provider</label><select id="engine"><option value="google">Google</option></select><label class="sr-only" for="mode">Collection target</label><select id="mode" hidden><option value="search">Search</option><option value="collect">Collect 50</option></select><label for="max-pages">Pages</label><select id="max-pages"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select><button id="search-button" type="submit">Search ↗</button></div>
<div id="ai-provider" hidden><label for="ai-engine" class="sr-only">AI provider</label><select id="ai-engine"><option value="gemini">Gemini</option></select><button id="ai-search-button" type="submit">Search ↗</button></div>
</form>
<div id="loading" role="status" hidden><span class="spinner"></span><span id="loading-text">Searching…</span></div>
</section>
<div id="message" role="status" aria-live="polite" hidden></div>
<section id="ai-results" hidden aria-label="AI Search"><p id="ai-status" role="status"></p><div id="ai-response" class="markdown"></div><h2 id="ai-sources-heading" hidden>Sources</h2><div id="ai-sources"></div><div id="ai-suggestions"></div><div class="run-actions"><button id="summarize-ai" type="button" hidden>Summarize</button></div><section id="ai-summary" hidden><h2>Summary</h2><div id="ai-summary-text" class="markdown"></div><div id="ai-downloads" class="run-actions"></div></section><details id="ai-details" class="details" hidden><summary>Details</summary><dl id="ai-metadata"></dl></details></section>
<section id="internet-results" hidden aria-label="Search results">
<div class="section-heading results-heading"><h1>Results <span id="result-count"></span></h1><label class="filter"><input id="all-observations" type="checkbox"> All observations</label></div>
<div class="run-actions"><button id="collect50" type="button">Collect 50</button><button id="refresh-search" type="button">Refresh</button><button id="collect-more" type="button" disabled>Collect More</button></div>
<details class="details"><summary>Details &amp; evidence</summary><span id="run-status"></span><dl id="diagnostic-values"></dl><div id="artifact-links"></div><button id="capture-run" type="button" disabled>Capture screenshot &amp; OCR</button></details>
<p id="empty-state" hidden>No results saved.</p><div id="results"></div></section>
<section id="library" hidden aria-labelledby="library-heading"><div class="section-heading"><h1 id="library-heading">Library</h1><button id="close-library" type="button">Back to search</button></div><label class="sr-only" for="library-filter">Search type</label><select id="library-filter"><option value="">All</option><option value="web">Web</option><option value="ai">AI</option></select><p id="library-status" role="status"></p><div id="library-list"></div><div class="run-actions"><button id="library-prev" type="button">Previous</button><span id="library-page"></span><button id="library-next" type="button">Next</button></div><div id="saved-ai"></div></section>
</main><footer><span>MY_CUSTOM_BOT</span><span>Help · README</span></footer></body></html>
